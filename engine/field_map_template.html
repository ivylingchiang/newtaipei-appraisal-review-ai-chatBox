<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地價查估書表審查對照總覽</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1b1f24; --muted:#5b6570; --line:#e2e6ea;
  --accent:#1f5fa8; --accent-soft:#e8f0fa;
  --ok:#2f7d4f; --ok-bg:#e6f2ea;
  --ext:#1f5fa8; --ext-bg:#e4eefa;
  --osm:#6b4d9e; --osm-bg:#efe9f8;
  --proxy:#9a7100; --proxy-bg:#fdf3d7;
  --warn:#a8560f; --warn-bg:#fbeadb;
  --miss:#a52a2a; --miss-bg:#fae6e6;
  --na:#6b7280; --na-bg:#eceff1;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",
       "Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 64px}

/* ── header ─────────────────────────────────────────────── */
header{background:var(--panel);border-bottom:1px solid var(--line)}
.hd{max-width:1500px;margin:0 auto;padding:18px 16px 0}
h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);
      padding-bottom:12px}
.meta b{color:var(--ink);font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
nav button{
  appearance:none;border:0;background:none;font:inherit;font-size:13px;cursor:pointer;
  padding:8px 13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ── layout ─────────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start;
      padding-top:18px}
@media(max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card + .card{margin-top:14px}
.card > h2{margin:0;padding:11px 14px;font-size:13.5px;background:#fbfcfd;
           border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.card > h2 small{font-weight:400;color:var(--muted);font-size:11.5px}

/* ── badges ─────────────────────────────────────────────── */
.b{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;line-height:1.7;
   white-space:nowrap;font-weight:600}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.b.derived{background:var(--ok-bg);color:var(--ok)}
.b.ext{background:var(--ext-bg);color:var(--ext)}
.b.ext_osm{background:var(--osm-bg);color:var(--osm)}
.b.proxy{background:var(--proxy-bg);color:var(--proxy)}
.b.assumed{background:var(--warn-bg);color:var(--warn)}
.b.insufficient{background:var(--warn-bg);color:var(--warn)}
.b.missing{background:var(--miss-bg);color:var(--miss)}
.b.narrative{background:var(--na-bg);color:var(--na)}
.b.na{background:var(--na-bg);color:var(--na)}
.cell{font-family:var(--mono);font-size:11px;background:#eef1f4;color:#39414a;
      padding:1px 5px;border-radius:4px;white-space:nowrap}

/* ── list view (表3) ────────────────────────────────────── */
.grp{border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.grp-h{padding:8px 14px;background:#f9fafb;font-size:12px;font-weight:700;color:#3b4450;
       display:flex;justify-content:space-between;gap:10px}
.grp-h span{font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;
     padding:8px 14px;border-top:1px solid #f0f2f4;cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .no{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.row .nm{min-width:0}
.row .nm b{font-weight:600;font-size:13px}
.row .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.row .rt{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap}
.row .rt .pm{font-family:var(--mono);color:#3b4450}

/* ── grid view (表5 / 表4) ──────────────────────────────── */
.tw{overflow-x:auto}
table.f{border-collapse:collapse;width:100%;font-size:12px;min-width:820px}
table.f th,table.f td{border:1px solid var(--line);padding:4px 7px;vertical-align:middle}
table.f thead th{background:#f4f6f8;font-size:11px;font-weight:600;color:#3b4450;
                 position:sticky;top:0;z-index:2}
table.f th.gh{background:#eef1f4;text-align:left;font-size:11.5px}
table.f td.rn{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;
              width:34px;background:#fafbfc}
table.f td.nm{min-width:210px}
table.f td.k{cursor:pointer;text-align:center;font-family:var(--mono);font-size:11px}
table.f td.k:hover{background:var(--accent-soft);outline:1px solid var(--accent)}
table.f td.k.sel{background:var(--accent-soft);outline:2px solid var(--accent)}
table.f tr.sum td{background:#f7f9fa;font-weight:600}
table.f tr.tot td{background:#eef1f4;font-weight:700}
.kv{font-size:10px;color:var(--muted);display:block}
td.k .st{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:4px;
         vertical-align:middle}
.st.ok,.st.derived{background:var(--ok)} .st.ext{background:var(--ext)}
.st.ext_osm{background:var(--osm)} .st.proxy{background:var(--proxy)}
.st.assumed,.st.insufficient{background:var(--warn)} .st.missing{background:var(--miss)}
.st.narrative,.st.na{background:var(--na)}

/* ── detail panel ───────────────────────────────────────── */
#detail{position:sticky;top:12px;max-height:calc(100vh - 28px);overflow:auto}
#detail .card{margin:0}
.dt{padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfd}
.dt h3{margin:0 0 6px;font-size:15px}
.dt .path{font-size:11.5px;color:var(--muted)}
.sec{padding:11px 14px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 7px;font-size:11px;letter-spacing:.08em;color:var(--muted);
        text-transform:uppercase;font-weight:700}
.chain{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:66px minmax(0,1fr);gap:8px;font-size:12px;
      align-items:start}
.step .tg{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);
          border-radius:4px;padding:1px 0;text-align:center;letter-spacing:.02em}
.step .tg.g{background:#7a8694}
.formula{font-family:var(--mono);font-size:11.5px;background:#f5f7f9;border:1px solid var(--line);
         border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;
         line-height:1.75}
.formula + .formula{margin-top:6px}
.note{font-size:11.5px;color:var(--muted);margin-top:6px}
table.mini{border-collapse:collapse;width:100%;font-size:11.5px}
table.mini th,table.mini td{border:1px solid var(--line);padding:3px 6px;text-align:left}
table.mini th{background:#f6f8f9;font-weight:600;font-size:10.5px;color:#3b4450}
table.mini td.r{text-align:right;font-family:var(--mono)}
.mx{border-collapse:collapse;font-size:10.5px;font-family:var(--mono)}
.mx td,.mx th{border:1px solid var(--line);padding:2px 5px;text-align:right}
.mx th{background:#f6f8f9}
.mx td.z{color:#aab2ba}
.mx td.p{color:var(--ok)} .mx td.n{color:var(--miss)}
details{font-size:12px}
details summary{cursor:pointer;color:var(--accent);font-size:11.5px;padding:2px 0}
ul.ml{margin:0;padding-left:17px;font-size:11.5px;color:#3c444d}
ul.ml li{margin:3px 0}
.warnbox{background:#fdf4ec;border:1px solid #f0d8bf;border-left:3px solid var(--warn);
         border-radius:6px;padding:8px 10px;font-size:11.5px;color:#6d4212}
.missbox{background:#fdeeee;border:1px solid #f1cccc;border-left:3px solid var(--miss);
         border-radius:6px;padding:8px 10px;font-size:11.5px;color:#7b2222}
.okbox{background:#ecf5ef;border:1px solid #cfe3d6;border-left:3px solid var(--ok);
       border-radius:6px;padding:8px 10px;font-size:11.5px;color:#255c3c}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}

/* ── gaps / sources ─────────────────────────────────────── */
.gapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;
         padding:14px}
.gap{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.gap h3{margin:0;padding:9px 12px;font-size:13px;background:#fafbfc;
        border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.gap h3 .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gap dl{margin:0;padding:10px 12px;display:grid;grid-template-columns:74px minmax(0,1fr);
        gap:5px 10px;font-size:11.5px}
.gap dt{color:var(--muted);font-weight:600}
.gap dd{margin:0}
.pill{display:inline-block;font-size:10.5px;background:#eef1f4;border-radius:4px;
      padding:1px 6px;margin:1px 3px 1px 0;font-family:var(--mono)}
.srch{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:8px}
.srch input{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);
            border-radius:7px;width:230px;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;padding:10px 14px;font-size:11px;
        color:var(--muted);border-top:1px solid var(--line);background:#fbfcfd}
.legend span{display:flex;gap:5px;align-items:center}
.legend i{width:9px;height:9px;border-radius:99px;display:inline-block}

/* ── 完整書表（與 output/fourthVersion/預覽.html 同樣式） ── */
#forms{padding-top:18px}
#forms h2{font-size:16px;margin:32px 0 0;padding-bottom:4px;border-bottom:2px solid #333}
#forms h2:first-of-type{margin-top:0}
#forms h3{font-size:13px;font-weight:600;color:#666;margin:14px 0 6px}
#forms .scroll{overflow-x:auto;background:#fff;border:1px solid #ddd}
#forms table{border-collapse:collapse;font-size:11px;white-space:nowrap}
#forms td{border:1px solid #c8c8c8;padding:2px 5px;vertical-align:middle;max-width:340px;
          overflow:hidden;text-overflow:ellipsis}
#forms td.has-note{cursor:help}
#forms .lg{display:inline-flex;align-items:center;margin-right:14px;font-size:12px}
#forms .lg i{width:14px;height:14px;border:1px solid #999;margin-right:5px;display:inline-block}

/* ── 人工審查編輯 ─────────────────────────────────────────── */
#forms td.ed{cursor:text}
#forms td.ed:hover{outline:1px solid var(--accent);outline-offset:-1px}
#forms td.ed:focus{outline:2px solid var(--accent);outline-offset:-2px;
                   white-space:normal;overflow:visible;max-width:none;
                   position:relative;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.14)}
/* 改過的格：左側藍條，滑鼠移上去的 title 會顯示原值 */
#forms td.dirty{box-shadow:inset 3px 0 0 var(--accent)}
/* 受改動牽連、但沒有自動重算的下游格（小計／總計／同列等級） */
#forms td.affected{outline:2px dashed #c8862a;outline-offset:-2px;background-image:
  repeating-linear-gradient(45deg,rgba(200,134,42,.13) 0 5px,transparent 5px 10px)}

.edbar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;
       flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
       border-radius:9px;padding:9px 12px;margin-bottom:14px;font-size:12.5px}
.edbar .n{font-weight:600}
.edbar .n b{color:var(--accent);font-family:var(--mono);font-size:14px}
.edbar .warn{color:#a8681c}
.edbar button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);
              background:#fff;border-radius:7px;cursor:pointer;color:var(--ink)}
.edbar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.edbar button:disabled{opacity:.45;cursor:default}
.edbar button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.edbar button.pri:hover:not(:disabled){background:#1a6fd4;color:#fff}
.edbar .sp{margin-left:auto}
.edbar .hint{color:var(--muted);font-size:11.5px;flex-basis:100%}

#edlist{border:1px solid var(--line);border-radius:9px;background:var(--panel);
        margin-bottom:14px;overflow:hidden}
#edlist table{width:100%;border-collapse:collapse;font-size:11.5px;white-space:normal}
#edlist th,#edlist td{border-bottom:1px solid var(--line);padding:6px 9px;
                      text-align:left;vertical-align:top;max-width:none}
#edlist th{background:#f4f6f8;font-size:10.5px;color:#3b4450;font-weight:600}
#edlist td.ref{font-family:var(--mono);font-size:10.5px;white-space:nowrap}
#edlist td.was{color:var(--muted);text-decoration:line-through}
#edlist td.now{font-weight:600}
#edlist input.why{font:inherit;font-size:11.5px;width:100%;padding:3px 6px;
                  border:1px solid var(--line);border-radius:5px;background:#fff}
#edlist button.rv{font:inherit;font-size:11px;padding:2px 8px;border:1px solid var(--line);
                  background:#fff;border-radius:5px;cursor:pointer;white-space:nowrap}
#edlist button.rv:hover{border-color:#c0392b;color:#c0392b}
#edlist .none{padding:14px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>地價查估書表審查對照總覽</h1>
    <div class="sub">表3 地價區段勘查表・表4 比較法調查估價表・表5 影響地價區域因素分析明細表<br>
      每一欄位與儲存格所<b>應</b>對照的表格、基準明細表細項、計算公式、審查交叉規則，
      以及目前留白處所使用的替代資料來源與計算方式</div>
    <div class="meta" id="meta"></div>
    <nav id="nav"></nav>
  </div>
</header>
<div class="wrap">
  <div class="cols">
    <main id="main"></main>
    <aside id="detail"></aside>
  </div>
  <div id="forms" hidden><!--__FORMS__--></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const E = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const byId = {};
[...DATA.regional, ...DATA.individual].forEach(f => byId[f.id] = f);
const SRC = Object.fromEntries(DATA.sources.map(s => [s.id, s]));
const GRP = {1:'土地使用管制',2:'交通運輸',3:'自然條件',4:'土地改良',5:'公共建設',
             6:'特殊設施',7:'環境污染',8:'其他影響因素'};
const STL = {ok:'可查表',derived:'可查表',ext:'外部推算 A/B',ext_osm:'外部推算 OSM',
             proxy:'代理判準',assumed:'區段推定',insufficient:'覆蓋不足',
             missing:'留白退補',narrative:'敘述型',na:'不適用'};
let tab = 't3', sel = null, q = '';

/* ══════════════════════════════════════════════ header */
$('#meta').innerHTML = [
  ['案號', DATA.case.case_no], ['轄區', DATA.case.region], ['用地別', DATA.case.land_use],
  ['估價基準日', DATA.case.date], ['比準地', DATA.case.base_segment],
  ['比較標的', DATA.case.comparables.join('、')]
].map(([k,v]) => `${E(k)}：<b>${E(v)}</b>`).join('');

const TABS = [['t3','表3 地價區段勘查表'],['t4','表4 比較法調查估價表'],
              ['t5','表5 影響地價區域因素分析明細表'],['final','完整書表（Final Layout）'],
              ['gap','缺少的資料與替代方式'],
              ['src','開放資料來源'],['rule','公式與審查規則']];
$('#nav').innerHTML = TABS.map(([k,l]) =>
  `<button data-t="${k}" aria-selected="${k===tab}">${E(l)}</button>`).join('') +
  `<span class="srch"><input id="q" type="search" placeholder="搜尋細項、儲存格、來源…"></span>`;
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  tab = b.dataset.t; sel = null; render();
});
$('#q').addEventListener('input', e => { q = e.target.value.trim(); render(); });

/* ══════════════════════════════════════════════ helpers */
const hit = f => !q || (f.name+' '+f.code+' '+(f.group_name||'')+' '+
  JSON.stringify(f.t3||'')+JSON.stringify(f.t5||'')+JSON.stringify(f.t4||'')).includes(q);
const badge = f => `<span class="b ${f.status}">${E(STL[f.status]||f.status)}</span>`;
const pm = f => f.max_adjustment==null ? '—' : `±${f.max_adjustment}%`;
const stepTxt = f => f.step==null ? '—' : `${(+f.step).toFixed(2)}%`;

function pick(id, cellRole){
  sel = {id, role: cellRole||null}; render();
  if (window.matchMedia('(max-width:1100px)').matches)
    $('#detail').scrollIntoView({behavior:'smooth', block:'start'});
}
window.pick = pick;

/* ══════════════════════════════════════════════ 表3 view */
function viewT3(){
  const gs = {};
  DATA.regional.filter(hit).forEach(f => (gs[f.group] = gs[f.group]||[]).push(f));
  let h = `<div class="card"><h2>表3 地價區段勘查表
    <small>區域因素評價細項 29 項　表3 勘查欄位 → 評價基準明細表 → 表5 列位</small></h2>`;
  if (!Object.keys(gs).length) h += `<div class="empty">無符合的欄位</div>`;
  for (const g of Object.keys(gs).sort((a,b)=>a-b)){
    const fs = gs[g];
    h += `<div class="grp"><div class="grp-h">（${g}）${E(GRP[g])}
      <span>${fs.length} 細項　小計列 表5 第${DATA.t5_layout.subtotal_rows[g]}列</span></div>`;
    h += fs.map(f => {
      const chips = [];
      if (f.t3.level_cell) chips.push(`<span class="cell">表3 ${f.t3.level_cell}/${f.t3.count_cell} 等級</span>`);
      if (f.t3.fact_cell) chips.push(`<span class="cell">表3 ${f.t3.fact_cell} 事實</span>`);
      (f.t3.subs||[]).forEach(s => chips.push(`<span class="cell">${E(s.cell)} ${E(s.name)}</span>`));
      if (f.t5.row) chips.push(`<span class="cell">表5 第${f.t5.row}列</span>`);
      (f.t4_fields||[]).forEach(n => chips.push(`<span class="cell">表4 #${n}</span>`));
      return `<div class="row ${sel&&sel.id===f.id?'sel':''}" onclick="pick('${f.id}')">
        <div class="no">${f.seq}</div>
        <div class="nm"><b>${E(f.name)}</b><div class="chips">${chips.join('')}</div></div>
        <div class="rt">${badge(f)}<br><span class="pm">${pm(f)}／${f.level_count}級</span></div>
      </div>`;
    }).join('');
    h += `</div>`;
  }
  h += legend() + `</div>`;

  const ex = DATA.t3_extra.filter(x => !q || (x.name+x.cell).includes(q));
  h += `<div class="card"><h2>表3 其他欄位 <small>無對應之評價細項（普通住宅用地）</small></h2>`;
  h += ex.length ? `<div class="tw"><table class="f"><thead><tr>
      <th style="width:74px">儲存格</th><th style="width:180px">欄位</th>
      <th style="width:150px">表3 現載</th><th>為何無對照</th></tr></thead><tbody>` +
      ex.map(x => `<tr><td class="rn" style="text-align:left">${E(x.cell)}</td>
        <td>${E(x.name)}</td><td>${x.raw==null?'<span class="b na">未填／不適用</span>':E(x.raw)}</td>
        <td style="font-size:11.5px;color:#4a535d">${E(x.why)}</td></tr>`).join('') +
      `</tbody></table></div>` : `<div class="empty">無符合的欄位</div>`;
  return h + `</div>`;
}

function legend(){
  return `<div class="legend">` + Object.entries(STL).filter(([k])=>k!=='derived'&&k!=='na')

/* ══════════════════════════════════════════════ 表5 view */
function viewT5(){
  const L = DATA.t5_layout, comps = DATA.case.comparables;
  let h = `<div class="card"><h2>表5 影響地價區域因素分析明細表（普通住宅用地）
    <small>點任一儲存格查看其對照與公式</small></h2><div class="tw"><table class="f">
    <thead><tr><th rowspan="2" class="rn">列</th><th rowspan="2">修正細項</th>
    <th colspan="2">比準地 ${E(DATA.case.base_segment)}</th>` +
    comps.map((c,i)=>`<th colspan="3">比較標的${i+1} ${E(c)}</th>`).join('') + `</tr><tr>
    <th>等級序號<br><span class="kv">${L.base_cols[0]}欄</span></th>
    <th>優劣等級<br><span class="kv">${L.base_cols[1]}欄</span></th>` +
    comps.map((c,i)=>`<th>序號<span class="kv">${L.comp_cols[i][0]}</span></th>
      <th>等級<span class="kv">${L.comp_cols[i][1]}</span></th>
      <th>修正%<span class="kv">${L.comp_cols[i][2]}</span></th>`).join('') +
    `</tr></thead><tbody>`;

  let g = 0;
  DATA.regional.forEach(f => {
    if (f.group !== g){
      g = f.group;
      h += `<tr><th class="gh" colspan="${2+2+comps.length*3}">（${g}）${E(GRP[g])}</th></tr>`;
    }
    const on = sel && sel.id === f.id;
    const s = f.per_seg || [];
    const cell = (r,i,kind) => {
      const p = s[i]||{};
      let v = kind==='rank' ? (p.rank|| (f.code==='other'?'－':'')) :
              kind==='label' ? (p.label||'') : '';
      if (kind==='pct') v = f.code==='other' ? '0.00%' :
        (f.status==='insufficient'||f.status==='missing') ? '—' :
        (p.rank && s[0].rank ? (((s[0].rank - p.rank) * f.step).toFixed(2)+'%') : '');
      return `<td class="k ${on?'sel':''}" onclick="pick('${f.id}','${kind}')">
        <span class="st ${f.status}"></span>${E(v||'·')}</td>`;
    };
    h += `<tr><td class="rn">${f.t5.row}</td><td class="nm">${E(f.name)}
        <span class="kv">${f.level_count}級／±${f.max_adjustment}%／級距 ${stepTxt(f)}</span></td>
      ${cell(null,0,'rank')}${cell(null,0,'label')}` +
      comps.map((c,i)=> cell(null,i+1,'rank')+cell(null,i+1,'label')+cell(null,i+1,'pct')).join('') +
      `</tr>`;
    const sr = L.subtotal_rows[f.group];
    const last = DATA.regional.filter(x=>x.group===f.group).slice(-1)[0];
    if (last.id === f.id){
      const ss = subStatus(f.group), sv = subValues(f.group);
      h += `<tr class="sum"><td class="rn">${sr}</td>
        <td class="nm">（${f.group}）${E(GRP[f.group])} 小計</td><td colspan="2"></td>` +
        comps.map((c,i)=>`<td colspan="2"></td>
          <td class="k" onclick="pick('sub.${f.group}','sub')">
          <span class="st ${ss}"></span>${sv[i]==null?'不成立':(sv[i]>0?'+':'')+sv[i].toFixed(2)+'%'}</td>`).join('') + `</tr>`;
    }
  });
  h += `<tr class="tot"><td class="rn">${L.total_row}</td>
    <td class="nm">影響地價區域因素總修正數<span class="kv">＝(1)+(2)+…+(8) 八組小計 → 表4 第8列</span></td>
    <td colspan="2"></td>` +
    comps.map(()=>`<td colspan="2"></td><td class="k" onclick="pick('total','total')">
      <span class="st missing"></span>不予產出</td>`).join('') + `</tr>`;
  return h + `</tbody></table></div>${legend()}</div>`;
}
const subValues = g => {
  const fs = DATA.regional.filter(f=>f.group===g);
  return DATA.case.comparables.map((c,i)=>{
    let s = 0;
    for (const f of fs){
      if (f.code==='other'){ continue; }
      if (f.status==='missing'||f.status==='insufficient') return null;
      const p = f.per_seg[i+1], b = f.per_seg[0];
      if (!p || !b || !p.rank || !b.rank) return null;
      s += (b.rank - p.rank) * f.step;
    }
    return s;
  });
};
const subStatus = g => {
  const fs = DATA.regional.filter(f=>f.group===g);
  if (fs.some(f=>f.status==='missing'||f.status==='insufficient')) return 'missing';
  if (fs.some(f=>f.status==='ext_osm'||f.status==='proxy')) return 'ext_osm';
  if (fs.some(f=>f.status==='ext')) return 'ext';
  return 'ok';
};

function viewDetail(){
  if (!sel) return `<div class="card"><div class="empty">
    點選左側任一欄位或儲存格<br><span style="font-size:12px">即顯示其應對照的表格、欄位、級距門檻、
    計算公式、審查交叉規則，以及目前的資料狀態與替代來源</span></div></div>`;
  let inner;
  if (sel.id === 'total') inner = detailTotal();
  else if (sel.id.startsWith('sub.')) inner = detailSubtotal(sel.id.slice(4));
  else if (sel.id.startsWith('chain.')) inner = detailStatic(CHAIN_D[sel.id.slice(6)],
      `<span class="b ${CHAIN[CHAIN.findIndex(c=>c.key===sel.id.slice(6))].st}">${
        STL[CHAIN[CHAIN.findIndex(c=>c.key===sel.id.slice(6))].st]}</span>`);
  else if (sel.id.startsWith('tot.')) inner = detailStatic(TOT_D[sel.id.slice(4)],
      `<span class="b missing">留白退補</span>`);
  else {
    const f = byId[sel.id];
    if (!f) return '';
    inner = f.kind === 'regional' ? detailRegional(f) : detailIndividual(f);
  }
  return `<div class="card">${inner}</div>`;
}

/* ══════════════════════════════════════════════ 人工審查編輯（完整書表）
   審查員直接在儲存格上改字，頁面記下「原值 → 新值 → 為什麼改」，可匯出成
   修正清單回饋工程端，或送回服務端套用到原始 xlsx 產出修正後的正式書表。
   頁面本身不保存任何東西：重新整理就回到 AI 產出的原狀。

   小計／總計不會自動重算（三份 xlsx 共 11,062 格幾乎全是 engine 算好寫入的
   靜態值，不是 Excel 公式）。改了上游只把受牽連的下游格標出來，由審查員自行
   判斷要不要一併更正——寧可標出來讓人決定，也不要送出半套重算的錯數字。 */

const EDITS = new Map();          // key → {file,sheet,ref,was,now,why}
const ORIG  = new Map();          // key → 原值（AI 產出）
const CELLS = new Map();          // key → [td]，含 file|*|ref 的跨工作表索引
let DEPS = {};

const keyOf = (file, sheet, ref) => `${file}|${sheet}|${ref}`;

/* td 的純文字：<br> 還原成換行，實體字元由 textContent 自動還原。
   不能用 innerText——#forms 預設 hidden，隱藏元素的 innerText 會退化成
   textContent 而把換行吃掉。 */
function cellText(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  return c.textContent.replace(/ /g, ' ');
}
function setCellText(el, s){
  el.textContent = '';
  String(s).split('\n').forEach((line, i) => {
    if (i) el.appendChild(document.createElement('br'));
    el.appendChild(document.createTextNode(line));
  });
}

/* 哪一格改了會牽動哪些格。座標全部取自 payload 既有的欄位對照，
   不另外猜：對不到座標的關係寧可不標。 */
function buildDeps(){
  const d = {};
  const add = (a, b) => { if (a && b && a !== b) (d[a] ||= new Set()).add(b); };
  const L = DATA.t5_layout || {}, base = DATA.case.base_segment;
  const comps = DATA.case.comparables || [];

  (DATA.regional || []).forEach(f => {
    const t3 = f.t3 || {}, t5 = f.t5 || {};
    if (!t5.row) return;
    const subCols = L.subtotal_cols || [];

    (t5.comp_cells || []).forEach((c, i) => {
      /* 等級序號／等級文字 → 同列修正百分比 → 該主要項目小計 → 總修正數 */
      add(`t5|*|${c.rank}`,  `t5|*|${c.pct}`);
      add(`t5|*|${c.label}`, `t5|*|${c.pct}`);
      if (t5.subtotal_row && subCols[i]) {
        const sub = `t5|*|${subCols[i]}${t5.subtotal_row}`;
        add(`t5|*|${c.pct}`, sub);
        if (L.total_row) add(sub, `t5|*|${subCols[i]}${L.total_row}`);
      }
    });

    /* 表3 的勘查事實與判定等級 → 表5 同一細項的等級欄（跨書表）。
       表3 一個地價區段一個工作表，所以比準地的格只牽動表5 比準地欄。 */
    [t3.fact_cell, t3.level_cell].filter(Boolean).forEach(ref => {
      add(`t3|${base}|${ref}`, `t5|*|${t5.base_rank_cell}`);
      add(`t3|${base}|${ref}`, `t5|*|${t5.base_label_cell}`);
      (t5.comp_cells || []).forEach((c, i) => {
        const sn = c.seg || comps[i];
        if (!sn) return;
        add(`t3|${sn}|${ref}`, `t5|*|${c.rank}`);
        add(`t3|${sn}|${ref}`, `t5|*|${c.label}`);
      });
    });
  });

  /* 表4：個別因素條件欄 → 同列差異率 */
  (DATA.individual || []).forEach(f => {
    ((f.t4 || {}).comp_cells || []).forEach(c => {
      add(`t4|*|${c.cond}`,  `t4|*|${c.diff}`);
      add(`t4|*|${c.cond2}`, `t4|*|${c.diff}`);
    });
  });

  Object.keys(d).forEach(k => d[k] = [...d[k]]);
  return d;
}

/* 從改動過的格出發，沿依賴往下走，標出所有受牽連但沒重算的格 */
function markAffected(){
  document.querySelectorAll('#forms td.affected').forEach(td => {
    td.classList.remove('affected');
    if (td.dataset.affTitle) { td.title = td.dataset.origTitle || ''; delete td.dataset.affTitle; }
  });
  if (!EDITS.size) return;

  const seen = new Set(), queue = [];
  EDITS.forEach((e, k) => {
    queue.push(keyOf(e.file, '*', e.ref), k);
  });
  while (queue.length) {
    const cur = queue.shift();
    (DEPS[cur] || []).forEach(nx => {
      if (seen.has(nx)) return;
      seen.add(nx); queue.push(nx);
    });
  }
  seen.forEach(k => (CELLS.get(k) || []).forEach(td => {
    const own = keyOf(td.dataset.file, td.dataset.sheet, td.dataset.ref);
    if (EDITS.has(own)) return;               // 自己也被人工改過了，不用再提醒
    td.classList.add('affected');
    if (!td.dataset.affTitle) {
      td.dataset.origTitle = td.title || '';
      td.dataset.affTitle = '1';
      td.title = '⚠ 上游欄位已被人工更正，這格是 AI 原本算出的值，未自動重算。'
               + (td.dataset.origTitle ? '\n\n' + td.dataset.origTitle : '');
    }
  }));
}

function onCellInput(td){
  const key = keyOf(td.dataset.file, td.dataset.sheet, td.dataset.ref);
  const was = ORIG.get(key) ?? '', now = cellText(td);
  if (now === was) {
    EDITS.delete(key);
    td.classList.remove('dirty');
    td.title = td.dataset.origTitle || td.title || '';
  } else {
    const prev = EDITS.get(key);
    EDITS.set(key, {file: td.dataset.file, sheet: td.dataset.sheet, ref: td.dataset.ref,
                    was, now, why: prev ? prev.why : ''});
    td.classList.add('dirty');
    if (td.dataset.origTitle === undefined) td.dataset.origTitle = td.title || '';
    td.title = `AI 原值：${was || '（空白）'}` +
               (td.dataset.origTitle ? '\n\n' + td.dataset.origTitle : '');
  }
  refresh();
}

function revert(key){
  const e = EDITS.get(key); if (!e) return;
  (CELLS.get(key) || []).forEach(td => {
    setCellText(td, e.was);
    td.classList.remove('dirty');
    td.title = td.dataset.origTitle || '';
  });
  EDITS.delete(key);
  refresh();
}

function refresh(){
  const n = EDITS.size;
  $('#edN').textContent = n;
  document.querySelectorAll('.needEdit').forEach(b => b.disabled = !n);
  $('#edWarn').textContent = n
    ? '　小計與總計不會自動重算，斜線標示的格請自行確認'  : '';
  markAffected();
  if (!$('#edlist').hidden) renderEdList();
}

function renderEdList(){
  const box = $('#edlist');
  if (!EDITS.size) { box.innerHTML = '<div class="none">尚未修改任何欄位。</div>'; return; }
  const titles = Object.fromEntries((DATA.form_files || []).map(f => [f.key, f.title]));
  const rows = [...EDITS.entries()].map(([k, e]) => `
    <tr data-k="${E(k)}">
      <td class="ref">${E(titles[e.file] || e.file)}<br>${E(e.sheet)} · ${E(e.ref)}</td>
      <td class="was">${E(e.was) || '（空白）'}</td>
      <td class="now">${E(e.now) || '（清空）'}</td>
      <td><input class="why" placeholder="為什麼改（選填，會寫進修正清單）"
                 value="${E(e.why)}"></td>
      <td><button class="rv">還原</button></td>
    </tr>`).join('');
  box.innerHTML = `<table><thead><tr><th>位置</th><th>AI 原值</th><th>更正為</th>
    <th>修正理由</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function patchPayload(){
  return {
    case_no: DATA.case.case_no, region: DATA.case.region,
    forms_src: DATA.forms_src, exported_at: new Date().toISOString(),
    edits: [...EDITS.values()],
  };
}

function download(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

function exportJson(){
  download(new Blob([JSON.stringify(patchPayload(), null, 2)],
           {type: 'application/json'}), '審查修正清單.json');
}

function exportCsv(){
  const titles = Object.fromEntries((DATA.form_files || []).map(f => [f.key, f.title]));
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = [['書表', '工作表', '儲存格', 'AI原值', '更正為', '修正理由'].join(',')];
  EDITS.forEach(e => lines.push([titles[e.file] || e.file, e.sheet, e.ref,
                                 e.was, e.now, e.why].map(q).join(',')));
  download(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}),
           '審查修正清單.csv');
}

/* 修正後的正式書表：patch 送回服務端，由服務端開原始 xlsx 套用後回傳。
   在瀏覽器端自行產生 xlsx 會丟掉底色、合併儲存格與填表依據註解。 */
async function exportXlsx(btn){
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '產生中…';
  try {
    const r = await fetch('export/xlsx', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(patchPayload())});
    if (!r.ok) throw new Error((await r.text()).slice(0, 300) || `HTTP ${r.status}`);
    download(await r.blob(), '修正後書表.zip');
  } catch (err) {
    alert('產生修正後書表失敗：\n' + err.message +
          '\n\n這個功能需要透過服務開啟本頁（直接用瀏覽器開啟本機 HTML 檔無法使用）。' +
          '\n修正內容仍可用「下載修正清單」保存。');
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

function initEditor(){
  const cells = document.querySelectorAll('#forms td[data-ref]');
  if (!cells.length) return;

  cells.forEach(td => {
    const wrap = td.closest('.scroll'), tbl = td.closest('table');
    const file = wrap ? wrap.dataset.file : '', sheet = tbl ? tbl.dataset.sheet : '';
    td.dataset.file = file; td.dataset.sheet = sheet;
    const key = keyOf(file, sheet, td.dataset.ref);
    if (td.isContentEditable) ORIG.set(key, cellText(td));
    /* 兩條索引：精確到工作表的，以及 file|*|ref 這種跨工作表的（表4／表5
       各只有一個工作表，依賴圖一律用 * 表示，不必寫死工作表名） */
    [key, keyOf(file, '*', td.dataset.ref)].forEach(k => {
      if (!CELLS.has(k)) CELLS.set(k, []);
      CELLS.get(k).push(td);
    });
  });

  DEPS = buildDeps();
  /* 表4 有些條件次欄在版面上被合併進前一格，座標對照表裡卻仍列著；
     這些起點永遠不會被點到，清掉讓依賴圖只留實際存在的格。 */
  Object.keys(DEPS).forEach(k => { if (!CELLS.has(k)) delete DEPS[k]; });

  const forms = $('#forms');
  forms.insertAdjacentHTML('afterbegin', `
    <div class="edbar">
      <span class="n">已更正 <b id="edN">0</b> 格</span>
      <span class="warn" id="edWarn"></span>
      <span class="sp"></span>
      <button id="edToggle" class="needEdit">修正清單</button>
      <button id="edCsv"  class="needEdit">下載修正清單 CSV</button>
      <button id="edJson" class="needEdit">JSON</button>
      <button id="edXlsx" class="needEdit pri">下載修正後書表</button>
      <button id="edReset" class="needEdit">全部還原</button>
      <span class="hint">有底色的格可直接點進去改（灰色「不適用」除外）；點一下會整格選起來，
        打字即取代。Enter 結束編輯、Shift+Enter 換行、Esc 取消該格。
        本頁不保存修改，重新整理即回到 AI 產出的原狀——改完請務必下載。</span>
    </div>
    <div id="edlist" hidden></div>`);

  forms.addEventListener('input', e => {
    const td = e.target.closest('td[contenteditable]');
    if (td) onCellInput(td);
  });
  /* 點進一格時整格選起來，直接打字就是取代整格值——審查多半是換掉一個判定，
     而不是補字。焦點已經在格子裡時再點一次即可把游標放在字中間。
     setTimeout 是為了讓瀏覽器先處理完點擊定位，否則選取會被蓋掉。 */
  forms.addEventListener('focusin', e => {
    const td = e.target.closest('td[contenteditable]');
    if (!td) return;
    setTimeout(() => {
      const s = getSelection();
      if (!s.isCollapsed || !td.contains(s.anchorNode)) return;   // 使用者自己選了一段就別動
      const r = document.createRange();
      r.selectNodeContents(td);
      s.removeAllRanges(); s.addRange(r);
    }, 0);
  });
  forms.addEventListener('keydown', e => {
    const td = e.target.closest('td[contenteditable]');
    if (!td) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); td.blur(); }
    else if (e.key === 'Escape') {
      e.preventDefault();
      const key = keyOf(td.dataset.file, td.dataset.sheet, td.dataset.ref);
      if (EDITS.has(key)) revert(key); else td.blur();
      td.blur();
    }
  });
  /* 貼上一律轉純文字，否則 Word／Excel 的 HTML 會整包塞進儲存格 */
  forms.addEventListener('paste', e => {
    const td = e.target.closest('td[contenteditable]');
    if (!td) return;
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t.replace(/\r\n?/g, '\n'));
  });

  $('#edToggle').addEventListener('click', () => {
    const box = $('#edlist');
    box.hidden = !box.hidden;
    if (!box.hidden) renderEdList();
  });
  $('#edlist').addEventListener('click', e => {
    if (!e.target.classList.contains('rv')) return;
    revert(e.target.closest('tr').dataset.k);
    renderEdList();
  });
  $('#edlist').addEventListener('input', e => {
    if (!e.target.classList.contains('why')) return;
    const k = e.target.closest('tr').dataset.k;
    if (EDITS.has(k)) EDITS.get(k).why = e.target.value;
  });
  $('#edCsv').addEventListener('click', exportCsv);
  $('#edJson').addEventListener('click', exportJson);
  $('#edXlsx').addEventListener('click', e => exportXlsx(e.currentTarget));
  $('#edReset').addEventListener('click', () => {
    if (!EDITS.size || !confirm(`確定要放棄全部 ${EDITS.size} 筆修正嗎？`)) return;
    [...EDITS.keys()].forEach(revert);
    renderEdList();
  });

  window.addEventListener('beforeunload', e => {
    if (EDITS.size) { e.preventDefault(); e.returnValue = ''; }
  });

  refresh();
}

/* ══════════════════════════════════════════════ render */
function render(){
  document.querySelectorAll('#nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.t === tab));
  const fin = tab === 'final';                 /* 完整書表：靜態版面，不受搜尋影響 */
  $('#forms').hidden = !fin;
  document.querySelector('.cols').style.display = fin ? 'none' : '';
  document.querySelector('.srch').style.display = fin ? 'none' : '';
  if (fin) return;
  $('#main').innerHTML = tab==='t3' ? viewT3() : tab==='t5' ? viewT5() :
    tab==='t4' ? viewT4() : tab==='gap' ? viewGap() :
    tab==='src' ? viewSrc() : viewRule();
  $('#detail').innerHTML = ['t3','t5','t4'].includes(tab) ? viewDetail() : '';
  $('#detail').style.display = ['t3','t5','t4'].includes(tab) ? '' : 'none';
  document.querySelector('.cols').style.gridTemplateColumns =
    ['t3','t5','t4'].includes(tab) ? '' : 'minmax(0,1fr)';
}
initEditor();
render();
</script>
</body>
</html>
