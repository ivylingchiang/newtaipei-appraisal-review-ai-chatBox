schema_version: '1.0'
articles:
- law: 土地徵收條例
  article: '30'
  content: 按徵收當期市價補償；公保地按毗鄰非保留地平均市價；每6個月評定市價變動幅度
- law: 土地徵收補償市價查估辦法
  article: 17Ⅲ
  content: 無適當成交案例時得擴大選取範圍及蒐集期間至估價基準日前一年內
- law: 土地徵收補償市價查估辦法
  article: '18'
  content: 比準地選取時機及原則
- law: 土地徵收補償市價查估辦法
  article: '19'
  content: 比準地地價查估之作業依據；第2項得擴大蒐集範圍
- law: 土地徵收補償市價查估辦法
  article: '20'
  content: 以比準地地價參酌宗地個別因素調整各宗地市價
- law: 土地徵收補償市價查估辦法
  article: '21'
  content: 地價尾數計算規定
- law: 土地徵收補償市價查估辦法
  article: 22~25
  content: 都市計畫區內公共設施保留地市價查估與計算
- law: 土地徵收補償市價查估辦法
  article: '27'
  content: 市價變動幅度作業步驟及計算單位
- law: 土地徵收補償市價查估辦法
  article: '29'
  content: 市價評議期程、評議結果適用期間
- law: 不動產估價技術規則
  article: '27'
  content: 應採3件以上比較標的，考量可信度與相近程度決定比較價格
- law: 不動產估價技術規則
  article: '43'
  content: 收益資本化率
extra_rules:
  source: doc/rules/extra.md
  rules:
  - 捷運開發地要用變身分之前的土地規格為準則（一般住宅規格）
  - 都市計畫中，未特別獎勵或一般巷道（8公尺寬以下道路）旁之住宅區，基準容積率常規劃為 200%
