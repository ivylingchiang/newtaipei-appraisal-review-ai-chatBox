schema_version: '1.0'
source:
  pdf: doc/rules/土地徵收補償市價查估作業手冊.pdf
  section: 肆、土地徵收補償市價查估書表製作流程
note: 條次為「土地徵收補償市價查估辦法」條次
forms:
- code: 表1-1
  range: 表1-1~表1-3
  article: 6~8
  name: 買賣實例調查估價表
  producer: 查估單位
  count: 3
- code: 表2
  article: 6~8
  name: 收益法調查估價表（含附表—成本法調查估價表）
  producer: 查估單位
- code: 表3
  article: 9Ⅱ
  name: 地價區段勘查表
  producer: 查估單位
  core: true
- code: 表4
  article: 19Ⅰ
  name: 比較法調查估價表
  producer: 查估單位
  core: true
- code: 表5
  range: 表5-1~表5-5
  article: 19Ⅲ
  name: 影響地價區域因素分析明細表
  producer: 查估單位
  count: 5
  core: true
  variants:
  - code: 表5-1
    land_use: 住宅用地
  - code: 表5-2
    land_use: 商業用地
  - code: 表5-3
    land_use: 工業用地
  - code: 表5-4
    land_use: 農業用地
  - code: 表5-5
    land_use: 其他用地
- code: 表6
  article: 20Ⅲ
  name: 徵收土地宗地市價估計表
  producer: 查估單位
- code: 表7
  article: 20Ⅳ
  name: 宗地個別因素清冊
  producer: 需用土地人
- code: 表8-1
  article: '25'
  name: 公共設施保留地地價加權平均計算表
  producer: 查估單位
- code: 表8-2
  article: '25'
  name: 公共設施保留地地價加權平均計算表（適用查估辦法第22條第4項）
  producer: 查估單位
- code: 表9
  article: '29'
  name: 徵收土地宗地市價評議表
  producer: 直轄市、縣(市)政府
- code: 表10
  article: '29'
  name: 徵收土地宗地市價清冊
  producer: 查估單位
- code: 表11-1
  article: '27'
  name: 市價變動幅度計算總表
  producer: 直轄市、縣(市)政府
- code: 表11-2
  article: '27'
  name: 市價變動幅度計算表（含續頁）
  producer: 直轄市、縣(市)政府
- code: 表12
  article: '30'
  name: 市價變動幅度評議表
  producer: 直轄市、縣(市)政府
- code: 表13
  article: '30'
  name: 市價變動幅度表
  producer: 直轄市、縣(市)政府
- code: 表14
  article: 19Ⅴ
  name: 比準地地價估計表
  producer: 查估單位
workflow:
- step: 1
  name: 蒐集基本資料、圖籍
  outputs: []
  note: 需用土地人提供預定徵收範圍地籍圖
- step: 2
  name: 調查實例及影響地價因素
  outputs:
  - 表3
  - 表1-1
  - 表2
  - 表7
- step: 3
  name: 估計實例土地正常單價
  outputs:
  - 表1-1
  - 表2
- step: 4
  name: 劃分或修正地價區段，繪製地價區段圖
  outputs: []
- step: 5
  name: 選取比準地
  outputs: []
  note: 一般徵收土地於預定徵收範圍之地價區段選取；都計內公共設施保留地於毗鄰地價區段選取
- step: 6
  name: 查估比準地地價
  outputs:
  - 表5
  - 表4
  - 表2
  - 表14
  note: 表5 須先於表4，因表4 之區域因素調整百分率引用表5 總修正數
- step: 7
  name: 估計預定徵收土地宗地市價
  outputs:
  - 表6
  - 表8-1
  - 表8-2
- step: 8
  name: 宗地市價提評
  outputs:
  - 表9
- step: 9
  name: 評定結果提供需用土地人
  outputs:
  - 表10
